<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>School Calendar</title>
<style>
:root{--bg:#0e1013;--card:#171a20;--card2:#1e222a;--line:#262b34;--txt:#e9ebef;--mut:#8b93a1;--gold:#d4af37;--red:#e0685a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);margin:0;padding:0 0 40px}
header{max-width:720px;margin:0 auto;padding:18px 14px 6px;display:flex;align-items:baseline;justify-content:space-between}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.2px}
.todaybtn{background:var(--gold);color:#111;border:0;border-radius:99px;padding:7px 16px;font-weight:700;font-size:13px;cursor:pointer}
nav{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 14px}
nav .mlab{flex:1;text-align:center;font-size:17px;font-weight:600}
nav button{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;width:42px;height:36px;font-size:17px;cursor:pointer}
.grid{max-width:720px;margin:0 auto;padding:0 10px;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{color:var(--mut);font-size:10.5px;text-align:center;padding:4px 0;font-weight:600;letter-spacing:.5px}
.day{background:var(--card);border-radius:10px;min-height:58px;padding:4px;cursor:pointer;border:1px solid transparent;position:relative;overflow:hidden;display:flex;flex-direction:column}
.day:active{background:var(--card2)}
.day.dim{opacity:.25;pointer-events:none}
.day.today{border-color:var(--gold)}
.day .n{color:var(--mut);font-size:10.5px;margin-bottom:2px}
.day.today .n{color:var(--gold);font-weight:700}
.pill{font-size:9.8px;border-radius:5px;padding:1.5px 4px;margin:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.pill.red{background:rgba(224,104,90,.16);color:#f0968a;font-weight:600}
.pill.deadline{background:rgba(212,175,55,.13);color:var(--gold)}
.pill.class{background:rgba(108,168,224,.12);color:#9cc4ee}
.pill.manual,.pill.academic{background:rgba(139,147,161,.13);color:#aab2c0}
.more{font-size:9.5px;color:var(--mut);margin-top:auto;padding-top:2px}
#detail{display:none;max-width:720px;margin:0 auto;padding:10px 14px}
.back{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer;margin-bottom:12px}
.dh{font-size:24px;font-weight:700;margin:2px 0 2px}
.dh-sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.topline{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--red)}
.evcard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--mut);border-radius:12px;padding:11px 13px;margin:8px 0}
.evcard.deadline{border-left-color:var(--gold)}
.evcard.red{border-left-color:var(--red);background:linear-gradient(90deg,rgba(224,104,90,.09),var(--card))}
.evcard .t{font-size:12px;color:var(--mut);display:flex;gap:8px;align-items:baseline;margin-bottom:3px}
.evcard .title{font-size:15px;line-height:1.4}
.evcard.red .title{font-weight:650}
.chip{font-size:10px;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.empty{color:var(--mut);text-align:center;padding:50px 20px;font-size:14px}
.note{max-width:720px;margin:14px auto 0;padding:0 14px;color:#5c6472;font-size:12px;text-align:center}
@media(max-width:520px){.day{min-height:50px;padding:3px}.pill{font-size:9px}.dh{font-size:20px}}
</style>
</head>
<body>
<div id="cal">
  <header><h1>School Calendar</h1><button class="todaybtn" onclick="goToday()">Today</button></header>
  <nav>
    <button onclick="shiftMonth(-1)" aria-label="previous month">‹</button>
    <div class="mlab" id="mlabel"></div>
    <button onclick="shiftMonth(1)" aria-label="next month">›</button>
  </nav>
  <div class="grid" id="grid"></div>
  <p class="note">Read-only — to add or change events, message the school-buddy bot on Telegram.</p>
</div>

<div id="detail">
  <button class="back" onclick="closeDay()">← Back to month</button>
  <div class="dh" id="dTitle"></div>
  <div class="dh-sub" id="dSub"></div>
  <div id="dList"></div>
</div>

<script>
let view=new Date(),ALL=[],curDate=null;
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const esc=s=>String(s).replace(/</g,'&lt;');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const prio=e=>(e.title.startsWith('🔴')?0:e.type==='deadline'?1:2)+(e.time||'23:59');
const isRed=e=>e.title.startsWith('🔴');
const pillClass=e=>isRed(e)?'red':(['deadline','class','academic','travel','tax','manual'].includes(e.type)?e.type:'manual');

async function load(){
  try{const r=await fetch('events.json?t='+Date.now());const d=await r.json();ALL=(d.events||d)||[];}
  catch(e){ALL=[];}
  ALL.forEach(e=>e._p=prio(e));
  ALL.sort((a,b)=>a.date.localeCompare(b.date)||a._p-b._p);
}

function shiftMonth(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);renderMonth();}
function goToday(){view=new Date();renderMonth();}

function renderMonth(){
  document.getElementById('cal').style.display='';
  document.getElementById('detail').style.display='none';
  if(location.hash)history.replaceState(null,'',location.pathname+location.search);
  const y=view.getFullYear(),m=view.getMonth();
  document.getElementById('mlabel').textContent=MON[m]+' '+y;
  const today=iso(new Date());
  const start=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  let g=DOW.map(d=>'<div class=dow>'+d+'</div>').join('');
  for(let i=0;i<start;i++)g+='<div class="day dim"></div>';
  for(let d=1;d<=days;d++){
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const evs=ALL.filter(x=>x.date===ds);
    const show=evs.slice(0,3);
    let inner=show.map(x=>'<div class="pill '+pillClass(x)+'">'+(x.time?x.time+' ':'')+esc(x.title).replace(/^🔴\s*/,'')+'</div>').join('');
    if(evs.length>3)inner+='<div class=more>+'+(evs.length-3)+' more</div>';
    g+='<div class="day'+(ds===today?' today':'')+'" onclick="openDay(\''+ds+'\')"><div class=n>'+d+'</div>'+inner+'</div>';
  }
  document.getElementById('grid').innerHTML=g;
}

function openDay(ds){
  curDate=ds;
  const p=ds.split('-').map(Number);
  const dt=new Date(p[0],p[1]-1,p[2]);
  document.getElementById('dTitle').textContent=DOW[dt.getDay()]+', '+MON[p[1]-1]+' '+p[2]+', '+p[0];
  const evs=ALL.filter(x=>x.date===ds);
  document.getElementById('dSub').textContent=evs.length?(evs.length+' item'+(evs.length>1?'s':'')+' · tap back to return to the month'):'No items scheduled';
  const red=evs.filter(isRed),rest=evs.filter(e=>!isRed);
  let h='';
  if(red.length){h+='<div class=topline>● IMPORTANT</div>'+red.map(card).join('');}
  if(rest.length){h+='<div class=topline style="color:var(--mut)">● ALSO TODAY</div>'+rest.map(card).join('');}
  document.getElementById('dList').innerHTML=h||'<div class=empty>Nothing scheduled — enjoy the day off.</div>';
  document.getElementById('cal').style.display='none';
  const det=document.getElementById('detail');det.style.display='block';window.scrollTo(0,0);
  history.replaceState(null,'','#'+ds);
}
function card(x){return '<div class="evcard '+pillClass(x)+'"><div class=t>'+(x.time?'<span>'+x.time+'</span>':'')+'<span class=chip>'+esc(x.type)+' · '+esc(x.source)+'</span></div><div class=title>'+esc(x.title)+'</div></div>';}
function closeDay(){curDate=null;renderMonth();}

window.addEventListener('popstate',()=>{const h=location.hash.slice(1);if(!h&&curDate)closeDay();});

load().then(()=>renderMonth());
</script>
</body>
</html>
